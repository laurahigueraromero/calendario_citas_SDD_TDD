# Ejecución en local contra los servicios de `docker compose up` (raíz).
# Las variables permiten sobrescribir si cambias puertos/credenciales en .env.

spring:
  # Carga el .env de la raíz del repo como propiedades (ejecuta desde backend/).
  # Así `./mvnw spring-boot:run` ve GITHUB_CLIENT_ID, etc. sin exportarlas a mano.
  config:
    import: "optional:file:../.env[.properties]"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/calendario}
    username: ${SPRING_DATASOURCE_USERNAME:calendario}
    password: ${SPRING_DATASOURCE_PASSWORD:calendario}
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
  jpa:
    show-sql: true

logging:
  level:
    org.hibernate.SQL: debug
