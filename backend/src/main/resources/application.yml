# Configuración común a todos los entornos.
# Lo específico de cada entorno va en application-{local,docker,test}.yml.
# Perfil activo por defecto: local (sobrescribible con SPRING_PROFILES_ACTIVE).

spring:
  application:
    name: calendario-citas
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    # La creación del esquema se hace con migraciones versionadas (Flyway).
    # Hibernate nunca toca el esquema.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration


  mail:
    port: ${SPRING_MAIL_PORT:1025}

  security:
    oauth2:
      client:
        # Los valores reales van en .env (local) o en variables de entorno.
        # Los "dummy" solo sirven para que el contexto arranque en CI/tests,
        # donde el login se simula y nunca se llama al proveedor de verdad.
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:dummy-github-id}
            client-secret: ${GITHUB_CLIENT_SECRET:dummy-github-secret}
            scope: read:user, user:email
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-secret}
            scope: openid, profile, email

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Configuración propia de la aplicación (ver PRD).
app:
  # Zona horaria única de empresa: se almacena en UTC y se presenta en esta zona.
  timezone: ${APP_TIMEZONE:Europe/Madrid}
